name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              DatabaseUrl="${{ secrets.DATABASE_URL }}" \
              DirectUrl="${{ secrets.DIRECT_URL }}" \
              OcrProvider="${{ secrets.OCR_PROVIDER }}" \
              OpenaiApiKey="${{ secrets.OPENAI_API_KEY }}" \
              VapidPublicKey="${{ secrets.VAPID_PUBLIC_KEY }}" \
              VapidPrivateKey="${{ secrets.VAPID_PRIVATE_KEY }}" \
              VapidEmail="${{ secrets.VAPID_EMAIL }}" \
              AllowedOrigins="${{ secrets.ALLOWED_ORIGINS }}"
